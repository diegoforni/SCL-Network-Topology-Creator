services:
  network-topology:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scl-network-topology
    ports:
      - "${TOPOLOGY_PORT:-9004}:9002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Mount shared directory - use environment variable or default
      - ${SHARED_DIR:-./shared}:/app/shared:ro
      # Mount images directory - use environment variable or default
      - ${IMAGES_DIR:-../../images}:/app/images:ro
      - ./.env:/app/.env:ro
    environment:
      - PLUGIN_ID=network-topology
      - PLUGIN_VERSION=2.0.0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
    networks:
      - scl-playground-net
    restart: unless-stopped

networks:
  scl-playground-net:
    external: true
