# nginx front door for the Acción del Sur full-stack target.
# Serves the built React/Vite frontend (frontend/dist) on :80 and reverse-proxies
# /api and /uploads to the Node backend on 127.0.0.1:3001, so the whole app is
# reachable same-origin from any host in the topology (no CORS, no Vite proxy
# needed at runtime).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Built frontend
    root /srv/repo/frontend/dist;
    index index.html;

    # Allow large media uploads (the app accepts donation photos via multer).
    client_max_body_size 25m;

    # API + uploads → backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
