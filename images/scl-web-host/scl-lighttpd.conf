# SCL web host lighttpd config (standalone — invoked by web-app-start.sh as PID 1).
# Serves the static status site from /var/www/scl and exposes /cgi-bin/status.sh,
# whose interpreter is the deliberately-vulnerable /usr/local/bin/bash-vuln.

server.modules = (
    "mod_indexfile",
    "mod_cgi",
    "mod_accesslog",
)

server.document-root = "/var/www/scl"
server.port          = 80
server.bind          = "0.0.0.0"
server.username      = "www-data"
server.groupname     = "www-data"
server.pid-file      = "/run/lighttpd.pid"
server.errorlog      = "/var/log/lighttpd/error.log"
accesslog.filename   = "/var/log/lighttpd/access.log"

index-file.names = ( "index.html" )

mimetype.assign = (
    ".html" => "text/html",
    ".txt"  => "text/plain",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".png"  => "image/png",
)

# /cgi-bin/ scripts are forced through the vulnerable interpreter explicitly (the
# empty extension key matches every file), so a request to /cgi-bin/status.sh runs
# /usr/local/bin/bash-vuln with the request's HTTP_* env vars in scope — the Shellshock
# vector. (Not relying on the shebang alone; belt-and-suspenders with the .sh rule.)
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( "" => "/usr/local/bin/bash-vuln" )
}

# Belt-and-suspenders: any .sh anywhere is also forced through bash-vuln.
cgi.assign += ( ".sh" => "/usr/local/bin/bash-vuln" )
