    "victim_net-victim": {
      "image": "ubuntu-24.04-opencode:0.1",
      "container_name": "scl-topology-soc-god-defender-e2e-d9395e-victim_net-victim",
      "hostname": "victim",
      "cap_add": [
        "NET_ADMIN"
