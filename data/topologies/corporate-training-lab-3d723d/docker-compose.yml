{
  "services": {
    "router-router1": {
      "image": "scl-plugin-network-topology-ubuntu:0.1",
      "container_name": "scl-topology-corporate-training-lab-3d723d-router-router1",
      "hostname": "core",
      "cap_add": [
        "NET_ADMIN"
      ],
      "sysctls": {
        "net.ipv4.ip_forward": "1"
      },
      "command": [
        "sh",
        "-lc",
        "set -eu\nsysctl -w net.ipv4.ip_forward=1 || true\nsysctl -w net.ipv4.conf.all.rp_filter=0 || true\nsysctl -w net.ipv4.conf.default.rp_filter=0 || true\n:\n\nwan_if=\"$(ip route show default | awk '{print $$5; exit}')\"\ncat > /tmp/router-rules.nft <<EOF\nflush ruleset\ntable inet filter {\n  chain forward {\n    type filter hook forward priority 0; policy drop;\n    ct state established,related accept\n    iifname \"lo\" accept\n    ip saddr 10.77.1.0/24 oifname \"$$wan_if\" accept\n    ip saddr 10.77.2.0/24 ip daddr 10.77.1.0/24 accept\n    ip saddr 10.77.3.0/24 ip daddr 10.77.1.0/24 accept\n    ip saddr 10.77.3.0/24 ip daddr 10.77.2.0/24 accept\n  }\n}\n\ntable ip nat {\n  chain postrouting {\n    type nat hook postrouting priority srcnat; policy accept;\n    oifname \"$$wan_if\" masquerade\n  }\n}\nEOF\nnft -f /tmp/router-rules.nft || true\n    tail -f /dev/null\n"
      ],
      "networks": {
        "scl-playground-net": {},
        "topo_net1": {
          "ipv4_address": "10.77.1.254"
        },
        "topo_net2": {
          "ipv4_address": "10.77.2.254"
        },
        "topo_net3": {
          "ipv4_address": "10.77.3.254"
        }
      },
      "labels": [
        "scl.plugin=network-topology",
        "scl.topology=corporate-training-lab-3d723d",
        "scl.router=router1"
      ]
    },
    "net1-h1_1": {
      "image": "scl-plugin-network-topology-ubuntu:0.1",
      "container_name": "scl-topology-corporate-training-lab-3d723d-net1-h1_1",
      "hostname": "dmz-1",
      "cap_add": [
        "NET_ADMIN"
      ],
      "command": [
        "sh",
        "-lc",
        "set -eu\n# Configure internet access via scl-playground-net\nip route replace default via 172.22.0.1 dev eth1 || true\nip route replace 10.77.1.0/24 dev eth0 || true\n# Configure DNS to use public DNS servers\necho \"nameserver 8.8.8.8\" > /etc/resolv.conf\necho \"nameserver 8.8.4.4\" >> /etc/resolv.conf\nmkdir -p /srv/scl-data /srv/www /srv/files /srv/db /var/log/scl /tmp/agents\ncat > /etc/scl-host.json <<'JSON'\n{\n  \"topology\": \"Corporate training lab\",\n  \"network\": \"dmz\",\n  \"host\": \"dmz-1\",\n  \"role\": \"Web server\",\n  \"ip\": \"10.77.1.11\"\n}\nJSON\ncat > /srv/scl-data/README.txt <<'DATA'\nTopology: Corporate training lab\nNetwork: dmz\nHost: dmz-1\nRole: Web server\nNo AI-generated data was requested for this host.\n\nDATA\ncp /srv/scl-data/README.txt /srv/www/index.txt || true\ncp /srv/scl-data/README.txt /srv/files/share.txt || true\nprintf '<h1>SCL web server</h1><pre>%s</pre>' \"$(cat /srv/scl-data/README.txt)\" > /srv/www/index.html\npython3 -m http.server 80 -d /srv/www &\n\n\ntail -f /dev/null\n"
      ],
      "networks": {
        "topo_net1": {
          "ipv4_address": "10.77.1.11"
        },
        "scl-playground-net": {}
      },
      "labels": [
        "scl.plugin=network-topology",
        "scl.topology=corporate-training-lab-3d723d",
        "scl.network=net1",
